<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- У посиланні — адреса одержувача. Нікуди її не передаємо: ні реферером
     (навіть Google Fonts), ні аналітикою. Тому загальний скрипт сайту з GA і
     пікселем тут не підключено.
     Назви файлів сайту (скрипт, стилі, товари) у цьому файлі НЕ писати навіть
     у коментарях: build-site.py дописує до них ?v=… у всіх */index.html, і бот
     щоразу змінював би цю сторінку (так і сталося 18.11.2026) -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Відписка — Lehlych Winery</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF7F2;
    --ink: #1E1508;
    --muted: #5A4038;
    --gold: #9A6F28;
    --dark: #1F0F0C;
    --line: #E3D3C4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--dark);
    padding: 28px 16px 26px;
    text-align: center;
  }
  header a { display: inline-block; }
  header img { width: 150px; height: auto; display: block; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px 64px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }
  .mark {
    width: 48px; height: 48px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--line);
    color: var(--gold);
    font-size: 22px; font-weight: 700;
  }
  .mark.ok   { border-color: var(--gold); }
  .mark.wait { border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark.wait { animation: none; } }
  h1 {
    margin: 0 0 12px;
    font-size: 24px; line-height: 1.3; font-weight: 700;
  }
  p {
    margin: 0;
    font-size: 16px; line-height: 1.6;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  p a { color: var(--gold); }
  .btn {
    display: inline-block;
    margin-top: 28px;
    padding: 15px 36px;
    border: 0;
    border-radius: 2px;
    background: var(--gold);
    color: var(--bg);
    font: 600 15px/1 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.88; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .btn[hidden] { display: none; }
  .back {
    display: inline-block;
    margin-top: 32px;
    color: var(--gold);
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <a href="/" aria-label="Lehlych Winery — на головну">
    <img src="/images/email/logo-white-2026.png" width="150" alt="Lehlych Winery">
  </a>
</header>

<main>
  <div class="card" role="status" aria-live="polite">
    <div class="mark" id="mark" aria-hidden="true">?</div>
    <h1 id="title">Відписатися від листів Lehlych Winery?</h1>
    <p id="text">Перевіряємо посилання…</p>
    <button class="btn" id="btn" type="button" hidden>Відписатися</button>
    <noscript>
      <p>Для відписки потрібен JavaScript. Або просто напишіть нам на
        <a href="mailto:info@lehlych.com?subject=%D0%92%D1%96%D0%B4%D0%BF%D0%B8%D1%81%D0%BA%D0%B0">info@lehlych.com</a> — відпишемо вручну</p>
    </noscript>
    <a class="back" href="/">lehlych.com</a>
  </div>
</main>

<script>
(function () {
  // Вебзастосунок «Відписка» (Apps Script). Адреса не секретна — вона є
  // в заголовку List-Unsubscribe кожного листа. Після «Нової версії»
  // розгортання вона НЕ змінюється, міняти тут нічого не треба
  var API = 'https://script.google.com/macros/s/AKfycbz5RHHojWs5kE5J7CcgpsU3LaBr7w-T5_6V2EGrU_jq7K8hBmzPVt7dptOtb8rL1JCt/exec';
  var CONTACT = 'info@lehlych.com';

  // Відписуємо ЛИШЕ після натискання кнопки. Корпоративні антивіруси
  // самі відкривають посилання з листів, інколи з JavaScript, але на
  // кнопки не тиснуть. Сторінка, що відписувала при відкритті, 19.11.2026
  // дала 3 «відписки» з 15 листів за годину — це були боти
  var q = new URLSearchParams(location.search);
  var u = q.get('u') || '';
  var s = q.get('s') || '';
  var campaign = q.get('campaign') || '';

  var mark = document.getElementById('mark');
  var title = document.getElementById('title');
  var text = document.getElementById('text');
  var btn = document.getElementById('btn');

  function show(t, msg, state, withMail) {
    title.textContent = t;
    text.textContent = msg;
    mark.className = 'mark' + (state === 'ok' ? ' ok' : state === 'wait' ? ' wait' : '');
    mark.textContent = state === 'ok' ? '✓' : state === 'wait' ? '' : state === 'ask' ? '?' : '!';
    if (withMail) {
      text.appendChild(document.createTextNode('. Напишіть нам на '));
      var a = document.createElement('a');
      a.href = 'mailto:' + CONTACT + '?subject=' + encodeURIComponent('Відписка');
      a.textContent = CONTACT;
      text.appendChild(a);
      text.appendChild(document.createTextNode(' — відпишемо вручну'));
    }
  }

  // credentials: 'omit' — без кук Google, інакше при кількох акаунтах
  // script.google.com відповідає «не вдається відкрити файл».
  // Параметр кампанії — campaign, НЕ «c»: на «c» Google відповідає 400
  function call(extra) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 20000);
    var params = new URLSearchParams({ u: u, s: s, campaign: campaign, format: 'json' });
    Object.keys(extra || {}).forEach(function (k) { params.set(k, extra[k]); });
    return fetch(API + '?' + params.toString(), {
      method: 'GET', credentials: 'omit', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined
    }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }, function (e) { clearTimeout(timer); throw e; });
  }

  if (!u || !s) {
    show('Посилання неповне', 'Схоже, його скопійовано не до кінця', 'err', true);
    return;
  }

  // Спершу лише перевіряємо посилання — це нічого не змінює
  call().then(function (d) {
    if (d && d.ok) {
      show(d.title, d.text, 'ask', false);
      btn.hidden = false;
    } else {
      show((d && d.title) || 'Посилання не підходить', (d && d.text) || 'Щось пішло не так', 'err', true);
    }
  }).catch(function () {
    show('Не вдалося перевірити посилання', 'Сервіс зараз не відповідає', 'err', true);
  });

  btn.addEventListener('click', function () {
    btn.disabled = true;
    show('Відписуємо…', 'Зачекайте кілька секунд', 'wait', false);
    call({ confirm: '1' }).then(function (d) {
      btn.hidden = true;
      if (d && d.ok) {
        show(d.title, d.text, 'ok', false);
        // Адреса людини більше не потрібна в рядку браузера й історії
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
      } else {
        show((d && d.title) || 'Не вдалося відписати', (d && d.text) || 'Щось пішло не так',
             'err', !(d && d.code === 'save_failed'));
      }
    }).catch(function () {
      btn.hidden = true;
      show('Не вдалося відписати', 'Сервіс зараз не відповідає', 'err', true);
    });
  });
})();
</script>

</body>
</html>
